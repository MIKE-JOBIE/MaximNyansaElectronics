name: Tests

on:
  push:
    branches:
      - main
      - codex/production-hardening
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Validate the full migration chain on a fresh local database
        env:
          FLASK_ENV: development
          SECRET_KEY: ci-migration-check-secret-key-not-for-production-000000
          DATABASE_URL: sqlite:///migration-check.db
        run: flask --app wsgi db upgrade
      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-only-secret-key-not-for-production-000000
          DATABASE_URL: sqlite:///ci.db
        run: python -m pytest -q
