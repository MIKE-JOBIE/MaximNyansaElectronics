name: Order reservation cleanup and email queue

on:
  # Keep manual-only until MNE_SITE_URL and MNE_MAINTENANCE_SECRET are configured
  # and the production recovery/maintenance endpoints have been verified.
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          SITE_URL: ${{ secrets.MNE_SITE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MNE_MAINTENANCE_SECRET }}
        run: |
          test -n "$SITE_URL"
          test -n "$MAINTENANCE_SECRET"
      - name: Release stale unpaid order reservations
        env:
          SITE_URL: ${{ secrets.MNE_SITE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MNE_MAINTENANCE_SECRET }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "X-Maintenance-Secret: $MAINTENANCE_SECRET" \
            "$SITE_URL/health/maintenance/release-stale"
      - name: Process queued email jobs
        env:
          SITE_URL: ${{ secrets.MNE_SITE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MNE_MAINTENANCE_SECRET }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "X-Maintenance-Secret: $MAINTENANCE_SECRET" \
            "$SITE_URL/health/maintenance/process-email-queue"
