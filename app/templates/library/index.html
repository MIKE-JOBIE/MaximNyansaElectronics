{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="section-head"><div class="eyebrow">E-Library</div><h2>Learning Resources</h2></div>
    <div class="d-flex flex-wrap gap-2 mb-3">
      <a href="{{ url_for('library.index') }}" class="btn-mn-outline btn-sm">All</a>
      {% for c in categories %}<a href="{{ url_for('library.index') }}?cat={{ c }}" class="btn-mn-outline btn-sm">{{ c }}</a>{% endfor %}
    </div>
    <div class="row">
      {% for r in resources %}
      <div class="col-md-4">
        <div class="mn-card" style="padding:1.5rem">
          <h5>{{ r.title }}</h5>
          <span class="badge-status badge-pending">{{ r.category }}</span>
          <p style="font-size:.9rem;margin-top:.5rem">{{ r.description }}</p>
          <a href="{{ r.file_url }}" target="_blank" class="btn-mn-outline btn-sm" style="align-self:flex-start;margin-top:auto">Open</a>
        </div>
      </div>
      {% else %}<p class="text-muted">No resources yet.</p>{% endfor %}
    </div>
  </div>
</section>
{% endblock %}
