{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <form method="POST" class="mn-form">
      {{ form.hidden_tag() }}
      <div class="section-head text-center" style="margin-bottom:1rem">
        <div class="eyebrow">Security</div><h2>Change Password</h2>
      </div>
      <label>Current Password</label>{{ form.current() }}
      <label>New Password</label>{{ form.password() }}
      <label>Confirm New Password</label>{{ form.confirm() }}
      <div style="margin-top:1.2rem">{{ form.submit(class="btn-mn-primary", style="width:100%") }}</div>
    </form>
  </div>
</section>
{% endblock %}
