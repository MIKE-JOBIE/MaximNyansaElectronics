{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <form method="POST" class="mn-form">
      <div class="section-head text-center" style="margin-bottom:1rem"><div class="eyebrow">Welcome Back</div><h2>Log In</h2></div>
      {{ form.hidden_tag() }}
      <label>Email</label>{{ form.email() }}
      <label>Password</label>{{ form.password() }}
      <label>Remember Me</label>{{ form.remember() }}
      <div style="margin-top:1.2rem">{{ form.submit(class="btn-mn-primary", style="width:100%") }}</div>
      <p class="text-center mt-3" style="font-size:.9rem">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </form>
  </div>
</section>
{% endblock %}
