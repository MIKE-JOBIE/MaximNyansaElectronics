{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <form method="POST" class="mn-form">
      {{ form.hidden_tag() }}
      <div class="section-head text-center" style="margin-bottom:1rem">
        <div class="eyebrow">Password Reset</div><h2>Forgot Your Password?</h2>
      </div>
      <p class="text-muted" style="font-size:.9rem">Enter your email — we'll send a reset link if an account exists.</p>
      <label>Email</label>{{ form.email() }}
      <div style="margin-top:1.2rem">{{ form.submit(class="btn-mn-primary", style="width:100%") }}</div>
      <p class="text-center mt-3" style="font-size:.9rem"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
    </form>
  </div>
</section>
{% endblock %}
