{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        {% if product.image %}<img src="{{ url_for('static', filename=product.image) }}" class="img-fluid">{% else %}<img src="{{ url_for('static', filename='img/tools.jpg') }}" class="img-fluid">{% endif %}
      </div>
      <div class="col-md-6">
        <div class="section-head"><h2>{{ product.name }}</h2></div>
        <span class="badge-status badge-{{ 'approved' if product.condition=='new' else 'pending' }}">{{ product.condition }}</span>
        <div class="price" style="font-size:1.6rem;margin:1rem 0">Le {{ "{:,.0f}".format(product.price) }}</div>
        <p>{{ product.description }}</p>
        <p class="text-muted">In stock: {{ product.stock }}</p>
        <form method="POST" action="{{ url_for('shop.add_to_cart', pid=product.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn-mn-primary" type="submit">Add to Cart</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
