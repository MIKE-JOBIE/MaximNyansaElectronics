{% extends "admin/_layout.html" %}
{% block admin %}
<div class="admin-header"><h1>Products</h1><a href="{{ url_for('admin.product_new') }}" class="btn-mn-primary btn-sm">+ New Product</a></div>
<table class="mn-table">
  <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Condition</th><th>Active</th><th></th></tr></thead>
  <tbody>
  {% for p in products %}
    <tr><td>{{ p.name }}</td><td>Le {{ "{:,.0f}".format(p.price) }}</td><td>{{ p.stock }}</td><td>{{ p.condition }}</td><td>{{ 'Yes' if p.is_active else 'No' }}</td>
      <td><a class="btn-mn-outline btn-sm" href="{{ url_for('admin.product_edit', pid=p.id) }}">Edit</a></td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
