services:
  - type: web
    name: maxim-nyansa-electronics
    env: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && flask db upgrade && flask seed && (flask backup-import || echo 'Import skipped — no changes')"
    startCommand: "gunicorn wsgi:app -c gunicorn.conf.py"
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: michaeljobi@maximnyansa.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: info@maximnyansa.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_TEST_MODE
        value: "true"
      - key: SITE_URL
        value: "https://maxim-nyansa-electronics.onrender.com"
      - key: ALLOWED_HOSTS
        value: "maxim-nyansa-electronics.onrender.com"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: RATELIMIT_STORAGE_URI
        sync: false          # e.g. a Render Key Value / Upstash Redis URL
      - key: PAYSTACK_CURRENCY
        sync: false          # currency of your Paystack account


