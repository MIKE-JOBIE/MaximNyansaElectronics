services:
  - type: web
    name: maxim-nyansa-app
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade && flask seed"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: maxim-nyansa-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@maximnyansa.com
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: maxim-nyansa-db
    databaseName: maxim_nyansa
    user: maxim_admin
    plan: free